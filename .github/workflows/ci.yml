name: Agent CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra pm-server
      - run: uv run --frozen pytest -q
      - run: python scripts/security_check.py
      - name: Verify reproducible worker image
        run: docker build -f services/gujeuk_pm/Dockerfile -t burserker-worker-ci .
      - name: Verify pinned Hermes compatibility patches
        run: docker build -f services/gujeuk_pm/Dockerfile.hermes -t burserker-hermes-ci .
      - name: Build consolidated gateway and isolated browser environment
        run: docker build -f services/gujeuk_pm/Dockerfile.single -t burserker-single-ci .
      - name: Verify single-image browser and unchanged SDK contracts
        run: |
          docker run --rm --network none --entrypoint /opt/pm/bin/python burserker-single-ci -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); assert b.new_page().evaluate('1+1')==2; b.close(); p.stop()"
          docker run --rm --network none --entrypoint /opt/hermes/.venv/bin/python burserker-single-ci -c "from gateway.session import SessionSource; from gateway.config import Platform; s=SessionSource(platform=Platform.DISCORD,chat_id='10',request_lane='123'); assert SessionSource.from_dict(s.to_dict()).request_lane=='123'"
          docker run --rm --network none --entrypoint /opt/hermes/.venv/bin/python burserker-single-ci -c "from gateway.session_context import set_session_vars,get_session_env,clear_session_vars; t=set_session_vars(platform='discord',scope_id='1413450780068937790',actor_id='42',chat_id='10',thread_id='11',message_id='12'); assert get_session_env('HERMES_SESSION_MESSAGE_ID')=='12'; assert get_session_env('HERMES_SESSION_ACTOR_ID')=='42'; clear_session_vars(t)"
          docker run -d --name single-smoke --network none -e BURSERKER_WORKERS_ENABLED=0 burserker-single-ci sleep 60
          docker exec single-smoke /opt/hermes/.venv/bin/python -c "from pathlib import Path; import time; deadline=time.monotonic()+30; p=Path('/run/service/pm-workers'); exec('while not p.exists() and time.monotonic()<deadline: time.sleep(0.2)'); assert p.exists(); assert Path('/proc/1/comm').read_text().strip()!='tini'"
          docker stop single-smoke
      - name: Test actual session serialization in the patched image
        run: >-
          docker run --rm --network none --entrypoint /opt/hermes/.venv/bin/python
          burserker-hermes-ci -c
          "from gateway.session import SessionSource,build_session_key; from gateway.config import Platform;
          s=SessionSource(platform=Platform.DISCORD,chat_id='10',chat_type='thread',scope_id='1413450780068937790',user_id='42',request_lane='123');
          r=SessionSource.from_dict(s.to_dict()); assert r.request_lane=='123'; assert build_session_key(r).endswith(':question:123')"
      - name: Verify pinned gateway metadata contract used by rollout guards
        run: >-
          docker run --rm --network none --entrypoint /opt/hermes/.venv/bin/python
          burserker-hermes-ci -c
          "from pathlib import Path;
          s=Path('/opt/hermes/gateway/status.py').read_text();
          r=Path('/opt/hermes/gateway/run.py').read_text();
          assert 'gateway_state.json' in s;
          assert all(key in s+r for key in ('active_agents','gateway_state','platforms','platform_state'))"
