[project]
name = "burserker-agent"
version = "0.1.0"
description = "Always-on Gujeuk workplace agent, collection and source-grounded wiki"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
pm-server = ["playwright>=1.56,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oijwef098234"]

[tool.pytest.ini_options]
testpaths = ["tests"]
